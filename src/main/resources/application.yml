spring:
  application:
    name: pesticide-inventory
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pesticide_inventory}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  security:
    user:
      name: ${SPRING_SECURITY_USER_NAME}
      password: ${SPRING_SECURITY_USER_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false
  thymeleaf:
    cache: false
shop:
  name: ${SHOP_NAME:AgroShop}
  address: ${SHOP_ADDRESS:}
  phone: ${SHOP_PHONE:}
