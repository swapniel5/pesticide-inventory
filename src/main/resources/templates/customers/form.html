<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle + ' - AgroShop'}">Customer - AgroShop</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/shell :: navigation}"></div>
<main class="container py-4">
    <div class="mb-4">
        <a class="link-success" th:href="@{/customers}">Back to customers</a>
        <h1 class="h2 mt-2" th:text="${formTitle}">Customer</h1>
    </div>
    <form class="card shadow-sm" method="post" th:action="${formAction}" th:object="${customerForm}">
        <div class="card-body">
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="name">Farmer name <span class="text-danger">*</span></label>
                    <input id="name" class="form-control" th:field="*{name}" required maxlength="150"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="phone">Mobile number <span class="text-danger">*</span></label>
                    <input id="phone" class="form-control" th:field="*{phone}" type="tel" required maxlength="14"
                           placeholder="10-digit number, optionally +91"
                           th:classappend="${#fields.hasErrors('phone')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{phone}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="village">Village <span class="text-danger">*</span></label>
                    <input id="village" class="form-control" th:field="*{village}" required maxlength="100"
                           th:classappend="${#fields.hasErrors('village')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{village}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="address">Address</label>
                    <textarea id="address" class="form-control" th:field="*{address}" rows="2" maxlength="300"></textarea>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('address')}" th:errors="*{address}"></div>
                </div>
                <div class="col-12">
                    <label class="form-label" for="notes">Notes</label>
                    <textarea id="notes" class="form-control" th:field="*{notes}" rows="3" maxlength="1000"></textarea>
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('notes')}" th:errors="*{notes}"></div>
                </div>
            </div>
        </div>
        <div class="card-footer bg-white d-flex gap-2">
            <button class="btn btn-success" type="submit">Save customer</button>
            <a class="btn btn-outline-secondary" th:href="@{/customers}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/shell :: copyright}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
