<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Customers | AgroShop</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/shell :: navigation}"></div>
<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Customers</h1>
            <p class="text-secondary mb-0">Manage farmer contact information.</p>
        </div>
        <a class="btn btn-success" th:href="@{/customers/new}">Add customer</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/customers}">
        <div class="col-sm-8 col-md-5">
            <label class="visually-hidden" for="search">Search customers</label>
            <input id="search" class="form-control" type="search" name="search"
                   placeholder="Search name, mobile or village" th:value="${search}">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-success" type="submit">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/customers}">Clear</a>
        </div>
    </form>

    <div class="table-responsive bg-white border rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th scope="col">Customer</th>
                <th scope="col">Mobile number</th>
                <th scope="col">Village</th>
                <th scope="col">Status</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="customer : ${customers}">
                <td><a class="link-success fw-semibold" th:href="@{/customers/{id}(id=${customer.id})}"
                       th:text="${customer.name}">Customer name</a></td>
                <td th:text="${customer.phone}">Mobile number</td>
                <td th:text="${customer.village}">Village</td>
                <td>
                    <span th:if="${customer.active}" class="badge text-bg-success">Active</span>
                    <span th:unless="${customer.active}" class="badge text-bg-secondary">Inactive</span>
                </td>
                <td><a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/customers/{id}/edit(id=${customer.id})}">Edit</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(customers)}">
                <td colspan="5" class="text-center text-secondary py-4">No customers found. Add a customer to get started.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/shell :: copyright}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
