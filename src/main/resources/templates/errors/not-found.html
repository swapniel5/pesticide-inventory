<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Not found | AgroShop</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/shell :: navigation}"></div>
<main class="container py-5">
    <div class="alert alert-warning">
        <h1 class="h4">Product not found</h1>
        <p class="mb-0" th:text="${message}">The requested product does not exist.</p>
    </div>
    <a class="btn btn-success" th:href="@{/products}">Back to products</a>
</main>
<footer th:replace="~{fragments/shell :: copyright}"></footer>
</body>
</html>
