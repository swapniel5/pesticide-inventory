<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<body>
<nav th:fragment="navigation" class="navbar navbar-expand-lg navbar-dark bg-success no-print">
    <div class="container">
        <a class="navbar-brand d-flex flex-column py-0" th:href="@{/}">
            <span class="fw-semibold lh-sm">AgroShop</span>
            <span class="small text-white-50 lh-sm">Crafted by Swapnil Jejurkar</span>
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavigation"
                aria-controls="mainNavigation" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div id="mainNavigation" class="collapse navbar-collapse">
            <div class="navbar-nav">
                <a class="nav-link rounded px-2"
                   th:classappend="${#strings.equals(#httpServletRequest.requestURI, '/')} ? ' active bg-white bg-opacity-10 fw-semibold' : ''"
                   th:href="@{/}"
                   th:attr="aria-current=${#strings.equals(#httpServletRequest.requestURI, '/')} ? 'page' : null">Dashboard</a>
                <a class="nav-link rounded px-2"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/products')} ? ' active bg-white bg-opacity-10 fw-semibold' : ''"
                   th:href="@{/products}"
                   th:attr="aria-current=${#strings.startsWith(#httpServletRequest.requestURI, '/products')} ? 'page' : null">Products</a>
                <a class="nav-link rounded px-2"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/inventory')} ? ' active bg-white bg-opacity-10 fw-semibold' : ''"
                   th:href="@{/inventory}"
                   th:attr="aria-current=${#strings.startsWith(#httpServletRequest.requestURI, '/inventory')} ? 'page' : null">Inventory</a>
                <a class="nav-link rounded px-2"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/customers')} ? ' active bg-white bg-opacity-10 fw-semibold' : ''"
                   th:href="@{/customers}"
                   th:attr="aria-current=${#strings.startsWith(#httpServletRequest.requestURI, '/customers')} ? 'page' : null">Customers</a>
                <a class="nav-link rounded px-2"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/sales')} ? ' active bg-white bg-opacity-10 fw-semibold' : ''"
                   th:href="@{/sales}"
                   th:attr="aria-current=${#strings.startsWith(#httpServletRequest.requestURI, '/sales')} ? 'page' : null">Sales</a>
                <a class="nav-link rounded px-2"
                   th:classappend="${#strings.startsWith(#httpServletRequest.requestURI, '/payments')} ? ' active bg-white bg-opacity-10 fw-semibold' : ''"
                   th:href="@{/payments}"
                   th:attr="aria-current=${#strings.startsWith(#httpServletRequest.requestURI, '/payments')} ? 'page' : null">Payments</a>
            </div>
        </div>
    </div>
</nav>

<footer th:fragment="copyright" class="no-print border-top mt-5 py-3">
    <div class="container text-center text-secondary small">
        <p class="mb-0">
            © <span th:text="${#dates.year(#dates.createNow())}">2026</span>
            AgroShop. All Rights Reserved. Created by Swapnil Jejurkar.
        </p>
    </div>
</footer>
</body>
</html>
