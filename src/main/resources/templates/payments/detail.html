<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment details - AgroShop</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/shell :: navigation}"></div>
<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <a class="link-success" th:href="@{/payments}">Back to payments</a>
    <div class="d-flex justify-content-between align-items-start gap-3 my-3">
        <div>
            <h1 class="h2 mb-1">Payment <span th:text="${payment.reference()}">PAY-1</span></h1>
            <a class="link-success" th:href="@{/customers/{id}(id=${payment.customerId})}"
               th:text="${payment.customerName}">Customer</a>
        </div>
        <div class="text-end">
            <div class="text-secondary">Amount received</div>
            <div class="h3" th:text="|₹${#numbers.formatDecimal(payment.amount, 1, 'COMMA', 2, 'POINT')}|">
                ₹0.00
            </div>
        </div>
    </div>

    <section class="card mb-4">
        <div class="card-header bg-white"><h2 class="h5 mb-0">Payment details</h2></div>
        <div class="card-body">
            <dl class="row mb-0">
                <dt class="col-sm-3">Date</dt>
                <dd class="col-sm-9" th:text="${#temporals.format(payment.paymentDate, 'yyyy-MM-dd HH:mm')}">Date</dd>
                <dt class="col-sm-3">Method</dt>
                <dd class="col-sm-9" th:text="${payment.paymentMethod}">CASH</dd>
                <dt class="col-sm-3">Transaction reference</dt>
                <dd class="col-sm-9" th:text="${payment.transactionReference ?: '-'}">Reference</dd>
                <dt class="col-sm-3">Notes</dt>
                <dd class="col-sm-9" th:text="${payment.notes ?: '-'}">Notes</dd>
            </dl>
        </div>
    </section>

    <section class="card">
        <div class="card-header bg-white"><h2 class="h5 mb-0">Invoice allocations</h2></div>
        <div th:if="${#lists.isEmpty(payment.allocations)}" class="card-body">
            <p class="text-secondary mb-0">No invoice allocations are recorded for this payment.</p>
        </div>
        <div th:unless="${#lists.isEmpty(payment.allocations)}" class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Invoice</th>
                    <th scope="col">Original amount</th>
                    <th scope="col">Amount allocated</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="allocation : ${payment.allocations}">
                    <td>
                        <a class="link-success" th:href="@{/sales/{id}(id=${allocation.saleId})}"
                           th:text="${allocation.invoiceNumber}">Invoice</a>
                    </td>
                    <td th:text="|₹${#numbers.formatDecimal(allocation.invoiceTotal, 1, 'COMMA', 2, 'POINT')}|">
                        ₹0.00
                    </td>
                    <td th:text="|₹${#numbers.formatDecimal(allocation.allocatedAmount, 1, 'COMMA', 2, 'POINT')}|">
                        ₹0.00
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </section>
</main>
<footer th:replace="~{fragments/shell :: copyright}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
