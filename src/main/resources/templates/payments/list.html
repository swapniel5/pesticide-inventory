<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payments - AgroShop</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/shell :: navigation}"></div>
<main class="container py-4">
    <h1 class="h2 mb-3">Payments</h1>
    <div th:if="${filterError}" class="alert alert-danger" role="alert" th:text="${filterError}"></div>

    <form class="card card-body mb-4" method="get" th:action="@{/payments}">
        <div class="row g-3 align-items-end">
            <div class="col-md-4">
                <label for="customerId" class="form-label">Customer</label>
                <select id="customerId" name="customerId" class="form-select">
                    <option value="">All customers</option>
                    <option th:each="customer : ${customers}" th:value="${customer.id}"
                            th:selected="${customer.id == customerId}"
                            th:text="|${customer.name} — ${customer.village}|">Customer</option>
                </select>
            </div>
            <div class="col-sm-6 col-md-3">
                <label for="fromDate" class="form-label">From date</label>
                <input id="fromDate" name="fromDate" type="date" class="form-control"
                       th:value="${fromDate}">
            </div>
            <div class="col-sm-6 col-md-3">
                <label for="toDate" class="form-label">To date</label>
                <input id="toDate" name="toDate" type="date" class="form-control"
                       th:value="${toDate}">
            </div>
            <div class="col-md-2 d-grid">
                <button class="btn btn-success" type="submit">Filter</button>
            </div>
        </div>
    </form>

    <div th:if="${#lists.isEmpty(payments)}" class="alert alert-info" role="status">
        No payments match these filters.
    </div>
    <div th:unless="${#lists.isEmpty(payments)}" class="card">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light">
                <tr>
                    <th scope="col">Payment reference</th>
                    <th scope="col">Customer</th>
                    <th scope="col">Date</th>
                    <th scope="col">Amount</th>
                    <th scope="col">Method</th>
                    <th scope="col">Details</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="payment : ${payments}">
                    <td th:text="${payment.reference()}">PAY-1</td>
                    <td>
                        <a class="link-success" th:href="@{/customers/{id}(id=${payment.customerId})}"
                           th:text="${payment.customerName}">Customer</a>
                    </td>
                    <td th:text="${#temporals.format(payment.paymentDate, 'yyyy-MM-dd HH:mm')}">Date</td>
                    <td th:text="|₹${#numbers.formatDecimal(payment.amount, 1, 'COMMA', 2, 'POINT')}|">₹0.00</td>
                    <td th:text="${payment.paymentMethod}">CASH</td>
                    <td><a class="btn btn-sm btn-outline-success"
                           th:href="@{/payments/{id}(id=${payment.id})}">View</a></td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
<footer th:replace="~{fragments/shell :: copyright}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
