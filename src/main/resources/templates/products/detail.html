<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name + ' - AgroShop'}">Product - AgroShop</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/shell :: navigation}"></div>
<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <a class="link-success" th:href="@{/products}">Back to products</a>
    <div class="d-flex flex-wrap justify-content-between align-items-start gap-3 my-3">
        <div>
            <h1 class="h2 mb-1" th:text="${product.name}">Product</h1>
            <p class="text-secondary mb-0" th:text="${product.brand ?: 'No brand specified'}">Brand</p>
        </div>
        <div class="d-flex gap-2">
            <a class="btn btn-outline-success" th:href="@{/products/{id}/edit(id=${product.id})}">Edit details</a>
            <form th:if="${product.active}" method="post" th:action="@{/products/{id}/deactivate(id=${product.id})}">
                <button class="btn btn-outline-danger" type="submit">Deactivate</button>
            </form>
        </div>
    </div>

    <div th:if="${product.lowStock}" class="alert alert-warning" role="alert">
        Low stock: only <strong th:text="|${product.quantity} ${product.unit}|"></strong> remaining.
    </div>
    <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3"><div class="card h-100"><div class="card-body">
            <div class="text-secondary">Current stock</div>
            <div class="fs-4 fw-semibold" th:text="|${product.quantity} ${product.unit}|">0 units</div>
        </div></div></div>
        <div class="col-sm-6 col-lg-3"><div class="card h-100"><div class="card-body">
            <div class="text-secondary">Selling price</div>
            <div class="fs-4 fw-semibold" th:text="${#numbers.formatDecimal(product.sellingPrice, 1, 2)}">0.00</div>
        </div></div></div>
        <div class="col-sm-6 col-lg-3"><div class="card h-100"><div class="card-body">
            <div class="text-secondary">Low-stock threshold</div>
            <div class="fs-4 fw-semibold" th:text="|${product.lowStockThreshold} ${product.unit}|">0 units</div>
        </div></div></div>
        <div class="col-sm-6 col-lg-3"><div class="card h-100"><div class="card-body">
            <div class="text-secondary">Status</div>
            <div class="fs-4 fw-semibold" th:text="${product.active} ? 'Active' : 'Inactive'">Active</div>
        </div></div></div>
    </div>

    <section class="card">
        <div class="card-header bg-white"><h2 class="h5 mb-0">Stock movement history</h2></div>
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-light"><tr><th>Date</th><th>Movement</th><th>Quantity</th><th>Remarks</th></tr></thead>
                <tbody>
                <tr th:each="movement : ${movements}">
                    <td th:text="${#temporals.format(movement.createdAt, 'yyyy-MM-dd HH:mm')}">Date</td>
                    <td th:text="${movement.movementType}">Type</td>
                    <td th:text="|${movement.quantity} ${product.unit}|">Quantity</td>
                    <td th:text="${movement.remarks ?: '-'}">Remarks</td>
                </tr>
                <tr th:if="${#lists.isEmpty(movements)}">
                    <td colspan="4" class="text-center text-secondary py-3">No stock movements recorded.</td>
                </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer bg-white"><a class="link-success" th:href="@{/inventory}">Manage inventory</a></div>
    </section>
</main>
<footer th:replace="~{fragments/shell :: copyright}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
