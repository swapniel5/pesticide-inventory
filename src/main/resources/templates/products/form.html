<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${formTitle + ' - AgroShop'}">Product - AgroShop</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/shell :: navigation}"></div>
<main class="container py-4">
    <div class="mb-4">
        <a class="link-success" th:href="@{/products}">Back to products</a>
        <h1 class="h2 mt-2" th:text="${formTitle}">Product</h1>
    </div>
    <form class="card shadow-sm" method="post" th:action="${formAction}" th:object="${productForm}">
        <div class="card-body">
            <div th:if="${#fields.hasGlobalErrors()}" class="alert alert-danger" role="alert">
                <p class="mb-0" th:each="error : ${#fields.globalErrors()}" th:text="${error}">There was a problem.</p>
            </div>
            <div class="row g-3">
                <div class="col-md-6">
                    <label class="form-label" for="name">Product name <span class="text-danger">*</span></label>
                    <input id="name" class="form-control" th:field="*{name}" required maxlength="150"
                           th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{name}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="brand">Brand</label>
                    <input id="brand" class="form-control" th:field="*{brand}" maxlength="100">
                    <div class="invalid-feedback d-block" th:if="${#fields.hasErrors('brand')}" th:errors="*{brand}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="unit">Unit <span class="text-danger">*</span></label>
                    <input id="unit" class="form-control" th:field="*{unit}" placeholder="e.g. bottle, kg, packet"
                           required maxlength="50" th:classappend="${#fields.hasErrors('unit')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{unit}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="sellingPrice">Selling price <span class="text-danger">*</span></label>
                    <input id="sellingPrice" class="form-control" type="number" step="0.01" min="0.01"
                           th:field="*{sellingPrice}" required
                           th:classappend="${#fields.hasErrors('sellingPrice')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{sellingPrice}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="quantity" th:text="${isNew} ? 'Opening quantity' : 'Current quantity'">
                        Quantity</label>
                    <input id="quantity" class="form-control" type="number" step="0.001" min="0"
                           th:field="*{quantity}" th:readonly="${!isNew}"
                           th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'">
                    <div class="form-text" th:if="${isNew}">Initial stock is recorded as an opening movement.</div>
                    <div class="form-text" th:unless="${isNew}">Use the Inventory page to change stock.</div>
                    <div class="invalid-feedback" th:errors="*{quantity}"></div>
                </div>
                <div class="col-md-6">
                    <label class="form-label" for="lowStockThreshold">Low-stock alert at</label>
                    <input id="lowStockThreshold" class="form-control" type="number" step="0.001" min="0"
                           th:field="*{lowStockThreshold}"
                           th:classappend="${#fields.hasErrors('lowStockThreshold')} ? 'is-invalid'">
                    <div class="invalid-feedback" th:errors="*{lowStockThreshold}"></div>
                </div>
            </div>
        </div>
        <div class="card-footer bg-white d-flex gap-2">
            <button class="btn btn-success" type="submit">Save product</button>
            <a class="btn btn-outline-secondary" th:href="@{/products}">Cancel</a>
        </div>
    </form>
</main>
<footer th:replace="~{fragments/shell :: copyright}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
