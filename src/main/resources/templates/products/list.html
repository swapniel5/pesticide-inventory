<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Products | AgroShop</title>
    <link th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}" rel="stylesheet">
</head>
<body class="bg-light">
<div th:replace="~{fragments/shell :: navigation}"></div>
<main class="container py-4">
    <div th:if="${successMessage}" class="alert alert-success" role="status" th:text="${successMessage}"></div>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4">
        <div>
            <h1 class="h2 mb-1">Products</h1>
            <p class="text-secondary mb-0">Manage products and prices. Change stock from Inventory.</p>
        </div>
        <a class="btn btn-success" th:href="@{/products/new}">Add product</a>
    </div>

    <form class="row g-2 mb-3" method="get" th:action="@{/products}">
        <div class="col-sm-8 col-md-5">
            <label class="visually-hidden" for="search">Search by product name</label>
            <input id="search" class="form-control" type="search" name="search" placeholder="Search product name"
                   th:value="${search}">
        </div>
        <div class="col-auto">
            <button class="btn btn-outline-success" type="submit">Search</button>
            <a class="btn btn-outline-secondary" th:href="@{/products}">Clear</a>
        </div>
    </form>

    <div class="table-responsive bg-white border rounded">
        <table class="table table-hover align-middle mb-0">
            <thead class="table-light">
            <tr>
                <th scope="col">Product</th>
                <th scope="col">Brand</th>
                <th scope="col">Unit</th>
                <th scope="col">In stock</th>
                <th scope="col">Selling price</th>
                <th scope="col">Status</th>
                <th scope="col"><span class="visually-hidden">Actions</span></th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="product : ${products}">
                <td><a class="link-success fw-semibold" th:href="@{/products/{id}(id=${product.id})}"
                       th:text="${product.name}">Product name</a>
                    <span th:if="${product.lowStock}" class="badge text-bg-warning ms-1">Low stock</span>
                </td>
                <td th:text="${product.brand ?: '-'}">Brand</td>
                <td th:text="${product.unit}">Unit</td>
                <td th:text="|${product.quantity} ${product.unit}|">0 units</td>
                <td th:text="${#numbers.formatDecimal(product.sellingPrice, 1, 2)}">0.00</td>
                <td>
                    <span th:if="${product.active}" class="badge text-bg-success">Active</span>
                    <span th:unless="${product.active}" class="badge text-bg-secondary">Inactive</span>
                </td>
                <td><a class="btn btn-sm btn-outline-secondary"
                       th:href="@{/products/{id}/edit(id=${product.id})}">Edit</a></td>
            </tr>
            <tr th:if="${#lists.isEmpty(products)}">
                <td colspan="7" class="text-center text-secondary py-4">No products found.</td>
            </tr>
            </tbody>
        </table>
    </div>
</main>
<footer th:replace="~{fragments/shell :: copyright}"></footer>
<script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
</body>
</html>
